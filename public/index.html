<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Referrals</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#04050c;--panel:#0a0f2e;--card:#121a47;--line:#27307a;--ink:#ffffff;--mute:#e4e7ff;--yellow:#C4B5FD;--yellow-d:#6f5fc0;--green:#F9A8D4;--blue:#F9A8D4;--orange:#F9A8D4;--purple:#C4B5FD;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:#000;font-family:'Sora',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);display:flex;justify-content:center}
.app{width:100%;max-width:460px;min-height:100vh;background:var(--bg);padding:14px 14px 40px}
.rise{opacity:0;transform:translateY(14px);animation:rise .55s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i,0)*70ms)}
@keyframes rise{to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-2px);border-color:#44444f}
.acc{position:relative;overflow:hidden}
.acc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--yellow))}
.top{display:flex;align-items:center;gap:14px;padding:14px 16px;margin-bottom:12px;border-color:#2d3690}
.top .lab{font-size:12px;color:var(--mute);margin-bottom:2px}
.num{display:flex;align-items:center;gap:10px;font-weight:700;font-size:30px;line-height:1.1;color:#fff}
.num .coin{width:38px;height:38px;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px) rotate(6deg)}}
.tag{flex:1;text-align:center;padding:10px 6px;font-weight:700;font-size:13px;letter-spacing:.8px;color:#fff;border:1px solid var(--yellow);border-radius:8px;background:rgba(196,181,253,.14)}
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}
.nav button{font:700 13px 'Sora',system-ui,sans-serif;color:var(--ink);padding:16px 2px;cursor:pointer;border-radius:12px}
.nav button.on{background:#F9A8D4;border-color:#F9A8D4;color:#000}
.sh{filter:drop-shadow(0 4px 6px rgba(0,0,0,.6))}
.panel{background:var(--panel);padding:20px 16px 30px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.stat{padding:16px 14px 16px 18px;font-size:14px;color:var(--mute);line-height:1.4;min-height:70px;display:flex;align-items:center;justify-content:center;gap:10px;text-align:center}
.stat strong{font-size:20px;color:var(--ink)}
.stat.sm{min-height:54px;padding:10px 12px 10px 18px;align-self:center}

.coin.big{width:42px;height:42px}
.line{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.coinbox{width:42px;display:flex;justify-content:center;flex:none}
.field{flex:1;min-width:0;height:50px;background:#0d0d10;border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;padding:0 14px;font-weight:600;font-size:16px;color:var(--ink);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.field.link{font-size:12px;color:#fff}
.btn{width:42%;flex:none;height:50px;border:0;border-radius:10px;font:700 17px 'Sora',system-ui,sans-serif;color:#000;cursor:pointer;background:var(--yellow);box-shadow:0 4px 0 var(--yellow-d);transition:transform .12s,box-shadow .12s,background .2s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--yellow-d)}
.btn.pulse{animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 4px 0 var(--yellow-d),0 0 0 0 rgba(196,181,253,.5)}70%,100%{box-shadow:0 4px 0 var(--yellow-d),0 0 0 14px rgba(196,181,253,0)}}

.btn:focus-visible,.nav button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.ico{width:42px;display:grid;place-items:center;flex:none}
.ico i{width:36px;height:36px;border-radius:10px;background:#F9A8D4;display:grid;place-items:center}
.ico svg{width:19px;height:19px}
.info{flex-direction:column;gap:8px;padding:20px 12px 20px 18px;min-height:100px}
.info strong{font-size:24px}
.hp{background:var(--panel);padding:10px 6px 16px;margin-top:30px}
.wrap{overflow-x:auto}
.hist{width:100%;border-collapse:collapse}
.hist th{font-weight:600;font-size:13px;text-align:left;padding:16px 12px;color:#fff}
.hist td{padding:30px 12px;text-align:center;color:var(--mute);font-size:14px;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);background:#000;border:1px solid var(--yellow);color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.rise{animation:none;opacity:1;transform:none}.num .coin,.btn.pulse{animation:none}}
#copy{background:#F9A8D4;box-shadow:0 4px 0 #b86a95}#copy:active{box-shadow:0 1px 0 #b86a95}#copy.ok{background:#fff}.dp{background:#2a1552}.card.top{background:#0f1650}
[hidden]{display:none!important}
#v-dep,#v-wd{display:flex;flex-direction:column;gap:10px}
.coinrow{display:flex;align-items:center;gap:14px;padding:12px 14px;text-align:left;color:#fff;font:600 14px 'Sora',system-ui,sans-serif;cursor:pointer;width:100%;background:var(--card)}
.coinrow b.n{display:block;font-size:15px;margin-bottom:4px}
.coinrow .m{font-size:13px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ci{position:relative;width:46px;height:46px;border-radius:50%;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.ci svg{width:100%;height:100%;border-radius:50%;display:block}.bd{position:absolute;right:-4px;bottom:-4px;width:22px;height:22px;border-radius:50%;border:2px solid var(--card);overflow:hidden;background:var(--card)}.bd svg{width:100%;height:100%;display:block;border-radius:0}
.usd{color:#F9A8D4;font-weight:700}
.back{align-self:flex-start;background:none;border:0;color:#fff;font:600 14px 'Sora',sans-serif;cursor:pointer;padding:6px 2px}
.dcard{padding:18px 16px;display:flex;flex-direction:column;gap:14px;background:var(--panel)}
.dh{display:flex;align-items:center;gap:14px;font-weight:700;font-size:17px}
.dcard label{font-size:13px;display:block;margin-bottom:6px}
.dcard input{width:100%;height:50px;background:#04050c;border:1px solid var(--line);border-radius:10px;padding:0 14px;color:#fff;font:600 18px 'Sora',sans-serif}
.dcard input:focus{outline:2px solid #C4B5FD;border-color:transparent}
.get{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:#2a1552;border-radius:10px;font-size:14px}
.get span:last-child{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px}
.dcard .btn{width:100%}
</style>
</head>

<script>
function tear(el){var w=el.offsetWidth,h=el.offsetHeight;if(!w||!h)return;var top=el.dataset.edge==='top',s=12,p=[];
 function r(){return 1+Math.random()*4}
 for(var x=0;x<w;x+=s)p.push([x,top?r():0]);
 p.push([w,top?r():0]);
 for(x=w;x>0;x-=s)p.push([x,top?h:h-r()]);
 p.push([0,top?h:h-r()]);
 el.style.clipPath='polygon('+p.map(function(q){return q[0].toFixed(1)+'px '+q[1].toFixed(1)+'px'}).join(',')+')'}
var ro=new ResizeObserver(function(es){es.forEach(function(e){tear(e.target)})});
document.querySelectorAll('[data-edge]').forEach(function(el){ro.observe(el)});
var COINS=[["TRX","trx",""],["GRAM","gram",""],["BNB (BEP20)","bnb",""],["DOGE","doge",""],["LTC","ltc",""],["SOL","sol",""],["POL","pol",""],["USDT (TRC20)","usdt","trx"],["USDT (BEP20)","usdt","bnb"],["USDT (POLYGON)","usdt","pol"],["USDT (SOLANA)","usdt","sol"],["USDT (TON)","usdt","ton"]];
function ic(c){return '<span class="ci"><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#i-'+c[1]+'"/></svg>'+(c[2]?'<i class="bd"><svg viewBox="0 0 56 56" aria-hidden="true"><use href="#i-'+c[2]+'"/></svg></i>':'')+'</span>'}
var MIN='Minimum: <span class="usd">$</span> 1.00 = <span class="coin"></span> 1.00';
var dep=document.getElementById('v-dep'),ref=document.getElementById('v-ref');
function list(){dep.innerHTML=COINS.map(function(c,i){return '<button class="card coinrow rise" style="--i:'+Math.min(i,8)+'" data-i="'+i+'">'+ic(c)+'<span><b class="n">'+c[0]+'</b><span class="m">'+MIN+'</span></span></button>'}).join('');
 dep.querySelectorAll('.coinrow').forEach(function(b){b.onclick=function(){detail(COINS[+b.dataset.i])}})}
function detail(c){dep.innerHTML='<button class="back" id="bk">\u2039 Back</button><div class="card dcard rise"><div class="dh">'+ic(c)+'<span>'+c[0]+'</span></div><div><label for="amt">Amount (USD)</label><input id="amt" type="number" inputmode="decimal" min="1" step="0.01" value="1.00"></div><div class="get"><span>You get</span><span><span class="coin"></span><span id="gv">1.00</span></span></div><div style="font-size:12px">'+MIN+'</div><button class="btn" id="dgo">Deposit</button></div>';
 var a=document.getElementById('amt');a.oninput=function(){var v=parseFloat(a.value);document.getElementById('gv').textContent=isNaN(v)?'0.00':v.toFixed(2)};
 document.getElementById('bk').onclick=list;
 document.getElementById('dgo').onclick=function(){var v=parseFloat(a.value);if(isNaN(v)||v<1){toast('Minimum deposit is $1.00');return}toast('Deposit of $'+v.toFixed(2)+' via '+c[0]+' requested')}}
var BAL=1.93,wd=document.getElementById('v-wd'),MINW='Minimum: <span class="coin"></span> 1.00 = <span class="usd">$</span> 1.00';
function wlist(){wd.innerHTML=COINS.map(function(c,i){return '<button class="card coinrow rise" style="--i:'+Math.min(i,8)+'" data-i="'+i+'">'+ic(c)+'<span><b class="n">'+c[0]+'</b><span class="m">'+MINW+'</span></span></button>'}).join('');
 wd.querySelectorAll('.coinrow').forEach(function(b){b.onclick=function(){wdetail(COINS[+b.dataset.i])}})}
function wdetail(c){wd.innerHTML='<button class="back" id="wbk">‹ Back</button><div class="card dcard rise"><div class="dh">'+ic(c)+'<span>'+c[0]+'</span></div><div><label for="wad">Wallet address</label><input id="wad" type="text" autocomplete="off" spellcheck="false" placeholder="Paste your '+c[0]+' address"></div><div><label for="wam">Amount (coins) · Balance '+BAL.toFixed(2)+'</label><input id="wam" type="number" inputmode="decimal" min="1" step="0.01" value="1.00"></div><div class="get"><span>You receive</span><span><span class="usd">$</span><span id="wgv">1.00</span></span></div><div style="font-size:12px">'+MINW+'</div><button class="btn" id="wgo">Withdraw</button></div>';
 var m=document.getElementById('wam'),a=document.getElementById('wad');
 m.oninput=function(){var v=parseFloat(m.value);document.getElementById('wgv').textContent=isNaN(v)?'0.00':v.toFixed(2)};
 document.getElementById('wbk').onclick=wlist;
 document.getElementById('wgo').onclick=function(){var v=parseFloat(m.value),ad=a.value.trim();
  if(ad.length<20){toast('Enter a valid wallet address');return}
  if(isNaN(v)||v<1){toast('Minimum withdrawal is 1.00');return}
  if(v>BAL){toast('Not enough balance');return}
  toast('Withdrawal of '+v.toFixed(2)+' via '+c[0]+' requested')}}
function route(){var h=location.hash.slice(1),k=h==='deposit'||h==='withdraw'?h:'referrals';ref.hidden=k!=='referrals';dep.hidden=k!=='deposit';wd.hidden=k!=='withdraw';
 document.querySelectorAll('[data-go]').forEach(function(b){b.classList.toggle('on',b.dataset.go===k)});if(k==='deposit')list();if(k==='withdraw')wlist()}
document.querySelectorAll('[data-go]').forEach(function(b){b.onclick=function(){var g=b.dataset.go;if(g==='game')toast('Coming soon');else location.hash=g}});
window.addEventListener('hashchange',route);route();
var calm=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
document.querySelectorAll('[data-count]').forEach(function(el){if(calm)return;var to=+el.dataset.count,d=+el.dataset.dec,t0=null;
 function f(t){if(!t0)t0=t;var k=Math.min((t-t0)/1100,1),e=1-Math.pow(1-k,3);el.textContent=(to*e).toFixed(d);if(k<1)requestAnimationFrame(f)}
 el.textContent=(0).toFixed(d);requestAnimationFrame(f)});
function toast(t){var e=document.getElementById('toast');e.textContent=t;e.classList.add('on');setTimeout(function(){e.classList.remove('on')},1600)}
var cb=document.getElementById('copy');
cb.onclick=function(){var t=document.getElementById('link').textContent;
 function done(){cb.textContent='Copied';cb.classList.add('ok');setTimeout(function(){cb.textContent='Copy';cb.classList.remove('ok')},1500)}
 try{navigator.clipboard.writeText(t).then(done,function(){toast('Press and hold to copy')})}catch(e){toast('Press and hold to copy')}};
document.getElementById('collect').onclick=function(){toast('Nothing to collect yet')};
</script>
